<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي المعرفة - لعبة المسابقات</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --text-color: #f8fafc;
            --accent: #22c55e;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 90%;
            max-width: 450px;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 24px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .question-box {
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: bold;
            min-height: 60px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-option {
            background-color: #334155;
            color: var(--text-color);
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: right;
        }

        .btn-option:hover:not(:disabled) {
            background-color: var(--primary-hover);
            color: #0f172a;
        }

        .btn-option.correct {
            background-color: var(--accent) !important;
            color: white;
        }

        .btn-option.wrong {
            background-color: var(--danger) !important;
            color: white;
        }

        .btn-main {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn-main:hover {
            background-color: var(--primary-hover);
        }

        .hidden {
            display: none;
        }

        .timer {
            color: #fbbf24;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة البداية -->
        <div id="start-screen">
            <h1>🧠 تحدي المعرفة</h1>
            <p>اختبر معلوماتك العامة عبر 70 سؤالاً متنوعاً بزمن محدد لكل سؤال!</p>
            <button class="btn-main" onclick="startQuiz()">ابدأ اللعب الآن</button>
        </div>

        <!-- شاشة اللعب -->
        <div id="quiz-screen" class="hidden">
            <div class="stats-bar">
                <span>النقاط: <strong id="score">0</strong></span>
                <span class="timer">الوقت: <span id="time-left">15</span>ث</span>
            </div>
            
            <div class="question-box" id="question-text">السؤال سيظهر هنا...</div>
            
            <div class="options-container" id="options-box">
                <!-- الخيارات ستتم تعبئتها ديناميكياً -->
            </div>
        </div>

        <!-- شاشة النهاية -->
        <div id="result-screen" class="hidden">
            <h1>🎉 انتهت المسابقة!</h1>
            <p>مجموع نقاطك النهائي هو:</p>
            <div id="final-score" style="color: var(--accent); font-size: 32px; font-weight: bold; margin-bottom: 20px;">0</div>
            <button class="btn-main" onclick="restartQuiz()">إعادة المحاولة</button>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "ما هي عاصمة أستراليا؟", options: ["سيدني", "ملبورن", "كانبيرا", "بريزبان"], answer: 2 },
            { question: "أي لغة برمجة تُستخدم أساساً لتطوير الويب من جهة العميل؟", options: ["Python", "JavaScript", "C++", "Java"], answer: 1 },
            { question: "ما هو العنصر الكيميائي الذي يرمز له بالحرف (O)؟", options: ["الذهب", "الأكسجين", "الحديد", "الفضة"], answer: 1 },
            { question: "ما هي لغة البرمجة التي تُعرف بكونها لغة الذكاء الاصطناعي الأساسية؟", options: ["Python", "HTML", "CSS", "SQL"], answer: 0 },
            { question: "أي من هذه الأجهزة يُستخدم لتخزين البيانات على المدى الطويل؟", options: ["الذاكرة العشوائية RAM", "القرص الصلب Hard Disk", "المعالج CPU", "لوحة الأم Motherboard"], answer: 1 },
            { question: "ما هي عاصمة فرنسا؟", options: ["لندن", "برلين", "باريس", "روما"], answer: 2 },
            { question: "ما هو أكبر كوكب في المجموعة الشمسية؟", options: ["المريخ", "زحل", "المشتري", "الأرض"], answer: 2 },
            { question: "كم عدد الكواكب في المجموعة الشمسية؟", options: ["7", "8", "9", "10"], answer: 1 },
            { question: "في أي قارة تقع دولة مصر؟", options: ["آسيا", "أفريقيا", "أوروبا", "أمريكا الجنوبية"], answer: 1 },
            { question: "كم عدد ألوان قوس قزح الأساسية؟", options: ["5 ألوان", "6 ألوان", "7 ألوان", "8 ألوان"], answer: 2 },

            { question: "ما هي عاصمة اليابان؟", options: ["سيول", "طوكيو", "بكين", "بانكوك"], answer: 1 },
            { question: "ما هي عاصمة ألمانيا؟", options: ["ميونخ", "فرانكفورت", "برلين", "هامبورغ"], answer: 2 },
            { question: "ما هي عاصمة إيطاليا؟", options: ["ميلانو", "فلورنس", "روما", "البندقية"], answer: 2 },
            { question: "ما هي عاصمة إسبانيا؟", options: ["برشلونة", "مدريد", "إشبيلية", "فالنسيا"], answer: 1 },
            { question: "ما هي عاصمة كندا؟", options: ["تورونتو", "فانكوفر", "أوتاوا", "مونتريال"], answer: 2 },
            { question: "ما هي عاصمة البرازيل؟", options: ["ريو دي جانيرو", "ساو باولو", "برازيليا", "سالفادور"], answer: 2 },
            { question: "ما هي عاصمة الأرجنتين؟", options: ["بوينس آيرس", "قرطبة", "روزاريو", "مندوزا"], answer: 0 },
            { question: "ما هي عاصمة الصين؟", options: ["شنغهاي", "بكين", "هونغ كونغ", "قوانغتشو"], answer: 1 },
            { question: "ما هي عاصمة روسيا؟", options: ["سانت بطرسبرغ", "موسكو", "كازان", "سوتشي"], answer: 1 },
            { question: "ما هي عاصمة المملكة العربية السعودية؟", options: ["جدة", "الرياض", "الدمام", "مكة المكرمة"], answer: 1 },

            { question: "ما هي عاصمة الامارات العربية المتحدة؟", options: ["دبي", "أبوظبي", "الشارقة", "عجمان"], answer: 1 },
            { question: "ما هي عاصمة الجزائر؟", options: ["وهران", "عنابة", "الجزائر العاصمة", "قسنطينة"], answer: 2 },
            { question: "ما هي عاصمة المغرب؟", options: ["الدار البيضاء", "مراكش", "الرباط", "فاس"], answer: 2 },
            { question: "ما هي عاصمة تونس؟", options: ["سوسة", "صفاقس", "تونس العاصمة", "بنزرت"], answer: 2 },
            { question: "ما هي عاصمة العراق؟", options: ["البصرة", "أربيل", "بغداد", "الموصل"], answer: 2 },
            { question: "ما هي عاصمة سوريا؟", options: ["حلب", "دمشق", "حمص", "اللاذقية"], answer: 1 },
            { question: "ما هي عاصمة لبنان؟", options: ["بيروت", "طرابلس", "صيدا", "جبيل"], answer: 0 },
            { question: "ما هي عاصمة الأردن؟", options: ["إربد", "عمان", "الزرقاء", "العقبة"], answer: 1 },
            { question: "ما هو الحيوان الذي يُسمى 'سفينة الصحراء'؟", options: ["الفيل", "الجمل", "الحصان", "الأسد"], answer: 1 },
            { question: "ما هو أسرع حيوان بري في العالم؟", options: ["الأسد", "النمر", "الفهد", "الغزال"], answer: 2 },

            { question: "أي الحيوانات التالية ينام إحدى عينيه مفتوحة؟", options: ["الدلفين", "القط", "الكلب", "الفأر"], answer: 0 },
            { question: "كم عدد عيون النحلة؟", options: ["عيون اثنتان", "ثلاث عيون", "خمس عيون", "سبع عيون"], answer: 2 },
            { question: "ما هو المعدن الذي يُصنع منه القصدير؟", options: ["الحديد", "القصدير", "النحاس", "الفضة"], answer: 1 },
            { question: "كم يبلغ عدد دقات قلب الإنسان الطبيعي في الدقيقة تقريباً؟", options: ["40 دقة", "72 دقة", "120 دقة", "150 دقة"], answer: 1 },
            { question: "أي غاز في الغلاف الجوي يحمي الأرض من الأشعة فوق البنفسجية؟", options: ["الأكسجين", "الأوزون", "النيتروجين", "الهيدروجين"], answer: 1 },
            { question: "ما هو أكبر محيط في العالم؟", options: ["المحيط الأطلسي", "المحيط الهندي", "المحيط الهادئ", "المحيط المتجمد الشمالي"], answer: 2 },
            { question: "ما هو أصغر قارات العالم مساحة؟", options: ["أوروبا", "أستراليا (أوقيانوسيا)", "أنتاركتيكا", "إفريقيا"], answer: 1 },
            { question: "ما هي الدولة التي تضم أكبر عدد من السكان في العالم؟", options: ["الهند", "الولايات المتحدة", "روسيا", "إندونيسيا"], answer: 0 },
            { question: "ما هو أطول نهر في العالم؟", options: ["نهر الأمازون", "نهر النيل", "نهر المسيسيبي", "نهر الدانوب"], answer: 1 },
            { question: "ما هو أعمق خندق مائي في العالم (خندق ماريانا) في أي محيط يقع؟", options: ["المحيط الأطلسي", "المحيط الهندي", "المحيط الهادئ", "المحيط المتجمد الجنوبي"], answer: 2 },

            { question: "من هو واضع علم الجبر؟", options: ["الخوارزمي", "ابن سينا", "البيروني", "ابن الهيثم"], answer: 0 },
            { question: "ما هي الدولة الملقبة بـ 'بلاد الأضواء'؟", options: ["إيطاليا", "فرنسا", "اليابان", "البرازيل"], answer: 1 },
            { question: "ما هي العملة الرسمية لدولة اليابان؟", options: ["الدولار", "اليورو", "الين", "اليوان"], answer: 2 },
            { question: "ما هي العملة الرسمية للمملكة المتحدة (بريطانيا)؟", options: ["الدولار", "الجنيه الاسترليني", "اليورو", "الفرنك"], answer: 1 },
            { question: "في أي عام هبط الإنسان لأول مرة على سطح القمر؟", options: ["1955", "1969", "1980", "1991"], answer: 1 },
            { question: "ما هو أكبر أعضاء جسم الإنسان الداخلية؟", options: ["القلب", "الكبد", "المخ", "الرئتان"], answer: 1 },
            { question: "كم عدد أضلاع الإنسان الطبيعية (في القفص الصدري الكامل)؟", options: ["12 ضلعاً", "20 ضلعاً", "24 ضلعاً", "30 ضلعاً"], answer: 2 },
            { question: "ما هو الغاز الأكثر وجوداً في الغلاف الجوي للأرض؟", options: ["الأكسجين", "ثاني أكسيد الكربون", "النيتروجين", "الهيدروجين"], answer: 2 },
            { question: "ما هو الجزء المسؤول عن التوازن في جسم الإنسان؟", options: ["المخ", "المخيخ", "نخاع الشوكي", "الأذن الداخلية"], answer: 3 },
            { question: "كم تبلغ نسبة الماء في جسم الإنسان البالغ تقريباً؟", options: ["30%", "60%", "85%", "95%"], answer: 1 },

            { question: "ما هو الكوكب الذي يُعرف بـ 'الكوكب الأحمر'؟", options: ["الزهرة", "المريخ", "عطارد", "نبتون"], answer: 1 },
            { question: "أي من هذه الألوان يعتبر لوناً أساسياً في الرسم؟", options: ["الأخضر", "البرتقالي", "الأحمر", "البنفسجي"], answer: 2 },
            { question: "ما هو الجهاز الذي يُستخدم لقياس ضغط الدم؟", options: ["الترمومتر", "البارومتر", "مقياس الضغط (Sphygmomanometer)", "الأميتر"], answer: 2 },
            { question: "ما هي عاصمة تركيا؟", options: ["اسطنبول", "أنقرة", "إزمير", "أنطاليا"], answer: 1 },
            { question: "ما هي عاصمة الهند؟", options: ["مومباي", "نيودلهي", "بنغالور", "كلكتا"], answer: 1 },
            { question: "ما هو اسم الفيلسوف اليوناني الشهير الذي كان معلماً للإسكندر الأكبر؟", options: ["سقراط", "أفلاطون", "أرسطو", "فيثاغورس"], answer: 2 },
            { question: "ما هي لغة البرمجة الأكثر استخداماً في بناء هيكل صفحات الويب (Markup Language)؟", options: ["HTML", "Python", "Java", "C++"], answer: 0 },
            { question: "ما هو اسم اختصار لغة التنسيق والستايل للويب؟", options: ["HTML", "CSS", "SQL", "PHP"], answer: 1 },
            { question: "من هو مكتشف قانون الجاذبية الأرضية؟", options: ["ألبرت أينشتاين", "إسحاق نيوتن", "جاليليو جاليلي", "نيكولا تسلا"], answer: 1 },
            { question: "ما هي الدولة الأكثر إنتاجاً للقهوة في العالم؟", options: ["كولومبيا", "إثيوبيا", "البرازيل", "فيتنام"], answer: 2 },

            { question: "ما هو الحيوان الذي يستطيع تغيير لون بشرته ليتناسب مع محيطه؟", options: ["الحرباء", "الأفعى", "التمساح", "السلحفاة"], answer: 0 },
            { question: "كم عدد أجنحة النحلة؟", options: ["جناحان", "أربعة أجنحة", "ستة أجنحة", "بدون أجنحة"], answer: 1 },
            { question: "ما هي عاصمة كوريا الجنوبية؟", options: ["بيونغ يانغ", "سيول", "بوسان", "إنتشون"], answer: 1 },
            { question: "ما هو الاسم العلمي لملح الطعام؟", options: ["كلوريد الصوديوم", "سلفات الكالسيوم", "هيدروكسيد الصوديوم", "كربونات الصوديوم"], answer: 0 },
            { question: "ما هي الدولة التي تُلقب بـ 'بلاد الشمس المشرقة'؟", options: ["الصين", "اليابان", "كوريا", "فيتنام"], answer: 1 },
            { question: "في أي قارة تقع صحراء كالاهاري؟", options: ["آسيا", "أستراليا", "أفريقيا", "أمريكا الجنوبية"], answer: 2 },
            { question: "ما هو الكوكب الأقرب إلى الشمس؟", options: ["الزهرة", "عطارد", "المريخ", "الأرض"], answer: 1 },
            { question: "ما هو الكوكب الأكثر سخونة في المجموعة الشمسية؟", options: ["عطارد", "الزهرة", "المريخ", "المشتري"], answer: 1 },
            { question: "ما هو الجهاز المستخدم لقياس الزلازل؟", options: ["البارومتر", "السيسموجراف (Seismograph)", "الأنيمومتر", "الترمومتر"], answer: 1 },
            { question: "ما هي الدولة التي يمر بها خط الاستواء وتعتبر أكبر دولة في أمريكا الجنوبية؟", options: ["الأرجنتين", "البرازيل", "تشيلي", "بيرو"], answer: 1 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timer;
        let timeLeft = 15;

        const startScreen = document.getElementById("start-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");
        const questionText = document.getElementById("question-text");
        const optionsBox = document.getElementById("options-box");
        const scoreDisplay = document.getElementById("score");
        const finalScore = document.getElementById("final-score");
        const timeLeftDisplay = document.getElementById("time-left");

        function startQuiz() {
            startScreen.classList.add("hidden");
            quizScreen.classList.remove("hidden");
            currentQuestion = 0;
            score = 0;
            scoreDisplay.textContent = score;
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timer);
            timeLeft = 15;
            timeLeftDisplay.textContent = timeLeft;
            startTimer();

            const currentObj = quizData[currentQuestion];
            questionText.textContent = currentObj.question;
            optionsBox.innerHTML = "";

            currentObj.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.textContent = option;
                btn.onclick = () => selectOption(index, btn);
                optionsBox.appendChild(btn);
            });
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timeLeftDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    handleTimeOut();
                }
            }, 1000);
        }

        function selectOption(selectedIndex, selectedBtn) {
            clearInterval(timer);
            const currentObj = quizData[currentQuestion];
            const allButtons = optionsBox.querySelectorAll(".btn-option");

            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentObj.answer) {
                selectedBtn.classList.add("correct");
                score += 10;
                scoreDisplay.textContent = score;
            } else {
                selectedBtn.classList.add("wrong");
                allButtons[currentObj.answer].classList.add("correct");
            }

            setTimeout(nextQuestion, 1200);
        }

        function handleTimeOut() {
            const currentObj = quizData[currentQuestion];
            const allButtons = optionsBox.querySelectorAll(".btn-option");
            allButtons.forEach(btn => btn.disabled = true);
            allButtons[currentObj.answer].classList.add("correct");

            setTimeout(nextQuestion, 1200);
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add("hidden");
            resultScreen.classList.remove("hidden");

            let highScore = localStorage.getItem("highScore") || 0;
            if (score > highScore) {
                localStorage.setItem("highScore", score);
                finalScore.innerHTML = score + " <br><span style='font-size: 16px; color: #fbbf24;'>⭐ رقم قياسي جديد!</span>";
            } else {
                finalScore.innerHTML = score + ` <br><span style='font-size: 14px; color: #94a3b8;'>أعلى نتيجة سابقة: ${highScore}</span>`;
            }
        }

        function restartQuiz() {
            resultScreen.classList.add("hidden");
            startScreen.classList.remove("hidden");
        }
    </script>
</body>
</html>
